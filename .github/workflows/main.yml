name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android/iOS folders if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name mawoonati --org com.mawoonati --platforms android,ios .
          fi
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons

      # لا توقف البناء عند الفشل كي تظهر النتائج كاملة في السجل
      - name: Analyze
        run: flutter analyze
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: mawoonati-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk mawoonati.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mawoonati.apk --title "مؤونتي - أحدث نسخة" --notes "أحدث APK" --latest
