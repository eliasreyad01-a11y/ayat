<title>AYAT | آيات</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">

:root[data-th="2"]{--bg:#0a1424;--sand:#ecd9a8;--gold:#c8a45c;--tur:#79e0d2;--lapis:#79e0d230;--ln:#9fb8ff2e;--g1:#9fb8ff1f;--g2:#9fb8ff0a;--mainbg:#ecd9a8}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
html,body{height:100%;overflow:hidden;color:#fff;font-family:Cairo,sans-serif}
body{background:transparent}
#bgw{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-4}
#bgw svg{width:100%;height:100%;display:block}
#bgp{position:absolute;top:0;right:0;bottom:0;left:0;background:center/cover;opacity:0;transition:opacity 1.4s}
body.still #bgw{animation:none}
@keyframes drift{from{transform:scale(1.07) translateX(-1%)}to{transform:scale(1.07) translateX(1%)}}
#shade{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-3;background:#000;opacity:var(--dim)}
#vig{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-2;background:radial-gradient(ellipse at 50% 38%,transparent 30%,#000a 100%),linear-gradient(to top,#000c 0%,transparent 45%)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:1.2vh;height:100vh;padding:2.4vh 2.2vw}
.glass{background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--ln);border-color:var(--ln);border-radius:28px}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 .6vw;text-shadow:0 2px 12px #000}
.brand{font-family:"Amiri Quran",serif;font-size:2.08vw;color:var(--sand);line-height:1}
.brand small{font:700 0.64vw Cairo,sans-serif;letter-spacing:.3em;margin-right:.8em;opacity:.85}
.stagew{position:relative;min-height:0}
#stage{position:absolute;top:1vh;right:6vw;bottom:3vh;left:6vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;text-shadow:0 2px 6px #000}
.v{font-family:"Amiri Quran",serif;font-size:var(--vs);line-height:1.75;color:var(--vc)}
.v.dm{font-size:calc(var(--vs)*.48);opacity:.45;animation:none}
.sub{color:var(--mute);font-size:1.04vw}
@keyframes in{from{opacity:0}to{opacity:1}}
#note{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:0.76vw;color:#ffffffb0;text-shadow:0 1px 6px #000}
#plt{height:4px;margin:0 .8vw;background:#ffffff2e;border-radius:4px;overflow:hidden}
#pl{height:100%;width:0;background:var(--sand);box-shadow:0 0 12px var(--sand)}
.np2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;padding:0 .8vw;text-shadow:0 2px 12px #000}
.cap h1{font-weight:900;font-size:2.16vw;line-height:1.15}
.cap p{color:var(--mute);font-size:1.04vw}
.tmw{justify-self:end;text-align:end;color:var(--sand);font-size:1.04vw}
.bar{display:flex;justify-content:center;align-items:center}
button{font:inherit;color:#fff;cursor:pointer;border:0;outline:3px solid transparent;outline-offset:3px;transition:none}
button:focus{outline-color:var(--tur)}
.rb{width:3.6vw;height:3.6vw;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--ln);}
.rb svg{width:46%;height:46%}
.rb:focus{background:var(--lapis);transform:translateY(-3px)}
.rb.main{width:4.6vw;height:4.6vw;background:var(--mainbg);color:#1d1606;border-color:#fff5}
.rb.main:focus{background:var(--mainbg);outline-color:#fff}
.dockp{padding:.9vh .7vw;display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:5.6vw minmax(0,1fr);align-items:center;gap:.6vw}
.drow h2{font-weight:700;font-size:0.96vw;color:var(--sand);padding-right:.7vw}
.hl{display:flex;overflow-x:auto;padding:.8vh .4vw;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;display:flex;align-items:center;padding:.35em .9em .35em 1.1em;border-radius:18px;background:#ffffff14;border:1px solid #ffffff10;font-size:0.92vw;font-weight:700;white-space:nowrap}
.item:focus{background:var(--lapis)}
.item.on{background:#ffffff26;box-shadow:inset 0 -3px 0 var(--sand)}
.mini{position:relative;width:2.5em;height:2.5em;flex:none;border-radius:50%;overflow:hidden;border:2px solid var(--sand);display:grid;place-items:center;background:linear-gradient(165deg,#ffffff22,#00000040)}
.ph{position:absolute;top:0;right:0;bottom:0;left:0;background:center/cover;display:grid;place-items:center}
.ph i{font:normal 700 1.4em "Amiri Quran",serif;color:var(--sand)}.ph.has i{display:none}
.badge{position:relative;width:1.9em;height:1.9em;flex:none;display:grid;place-items:center;color:var(--sand);font:700 .8em "Amiri Quran",serif}
.badge::before,.badge::after{content:"";position:absolute;top:12%;right:12%;bottom:12%;left:12%;border:1.5px solid var(--sand);opacity:.8}
.badge::after{transform:rotate(45deg)}.badge i{position:relative;font-style:normal}
.chip{flex:0 0 auto;font-weight:600;font-size:0.84vw;padding:.45em 1em;border-radius:14px;background:#ffffff1a;border:1px solid #ffffff12;white-space:nowrap}
.chip:focus{background:var(--lapis)}
#toast{position:fixed;left:0;right:0;bottom:4vh;margin:auto;width:max-content;max-width:84vw;background:var(--sand);color:#241c05;font-weight:700;padding:.7em 1.5em;border-radius:14px;font-size:1.12vw;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dock2{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw;padding:1vh .8vw}
.dk{display:flex;flex-direction:column;align-items:flex-start;padding:.7em 1.3em;border-radius:20px;background:#ffffff14;border:1px solid #ffffff12;text-align:start;min-width:0}
.dk small{color:var(--mute);font-weight:600;font-size:0.76vw}
.dk b{font-size:1.12vw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dk:focus{background:var(--lapis)}
#sheet{position:fixed;left:2.2vw;right:2.2vw;bottom:16vh;max-height:76vh;z-index:7;display:flex;flex-direction:column;padding:1.6vh 1.2vw;background:#12141a}
#sheet[hidden]{display:none}
#sheet.tall{top:8vh}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 .6vw 1vh}
.sh h2{font-weight:700;font-size:1.44vw;color:var(--sand)}
.cnt{color:var(--mute);font-size:0.8vw}
#shb{flex:1;overflow-y:auto;scrollbar-width:none;display:grid;gap:.7vw;padding:.8vh .5vw;align-content:start}
#shb::-webkit-scrollbar{display:none}
#shb .item{width:100%;min-width:0}
#shb .okb{grid-column:1/-1}
.okb{background:var(--mainbg)!important;color:#1d1606;justify-content:center;font-weight:900}
#dlg,#dlr{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:64vw;padding:3vh 2.4vw;display:flex;flex-direction:column;background:#12141a}
#dlg[hidden],#dlr[hidden]{display:none}
#dlg h2,#dlr h2{font-weight:700;font-size:1.44vw;color:var(--sand)}
#dlg input[type=url],#dlr input[type=url],#dlr input[type=text]{font:inherit;font-size:1.04vw;padding:.7em 1em;border-radius:14px;border:1px solid var(--ln);background:#ffffff12;color:#fff;outline:3px solid transparent;outline-offset:2px;direction:ltr;text-align:left}
#dlg input[type=url]:focus,#dlr input:focus{outline-color:var(--tur)}
#dlg .bar,#dlr .bar{justify-content:center;margin-top:1vh}
#stage>*+*{margin-top:1.6vh}
.bar>*+*{margin-right:1.1vw}
.dockp>*+*{margin-top:.3vh}
.hl>*+*{margin-right:.6vw}
.item>*+*{margin-right:.7em}
.dk>*+*{margin-top:.15em}
#dlg>*+*,#dlr>*+*{margin-top:1.6vh}
.rb{flex:none}
*{animation:none!important;transition:none!important}
body.idle .top,body.idle #plt,body.idle .np2,body.idle .dock2{visibility:hidden}
</style>
</head>
